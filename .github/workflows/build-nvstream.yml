---
name: Build NVStream
permissions: {}

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version string (e.g. 2026.10.1). Bo trong thi lay short SHA.'
        required: false
        type: string
        default: ''

env:
  PYTHON_VERSION: '3.14'

jobs:
  build_windows:
    name: Windows-AMD64
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ inputs.release_version }}")) {
            $sha = "${{ github.sha }}".Substring(0, 7)
            $version = "2026.10.$sha"
          }
          else {
            $version = "${{ inputs.release_version }}"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "version=$version"

      - name: Setup Dependencies Windows
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2.33.0
        with:
          msystem: ucrt64
          update: true
          install: wget

      - name: Update Windows dependencies
        env:
          TOOLCHAIN: ucrt-x86_64
        run: |
          dependencies=(
            "git"
            "mingw-w64-${TOOLCHAIN}-boost"
            "mingw-w64-${TOOLCHAIN}-cmake"
            "mingw-w64-${TOOLCHAIN}-cppwinrt"
            "mingw-w64-${TOOLCHAIN}-curl-winssl"
            "mingw-w64-${TOOLCHAIN}-doxygen"
            "mingw-w64-${TOOLCHAIN}-gcc"
            "mingw-w64-${TOOLCHAIN}-graphviz"
            "mingw-w64-${TOOLCHAIN}-miniupnpc"
            "mingw-w64-${TOOLCHAIN}-nlohmann-json"
            "mingw-w64-${TOOLCHAIN}-onevpl"
            "mingw-w64-${TOOLCHAIN}-openssl"
            "mingw-w64-${TOOLCHAIN}-opus"
            "mingw-w64-${TOOLCHAIN}-toolchain"
            "mingw-w64-${TOOLCHAIN}-qt6-static"
            "mingw-w64-${TOOLCHAIN}-MinHook"
            "mingw-w64-${TOOLCHAIN}-nsis"
          )
          pacman -Syu --noconfirm "${dependencies[@]}"

      - name: Setup dotnet  # needed for wix
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.x'

      - name: Setup NodeJS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 'lts/*'

      - name: NodeJS Path
        shell: pwsh
        run: |
          $NODEJS_BINARY_PATH = (Get-Command node).Source
          $NODEJS_PATH = Split-Path -Path "$NODEJS_BINARY_PATH" -Parent
          echo "NODEJS_PATH=$NODEJS_PATH" >> $env:GITHUB_ENV

      - name: Setup python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Sync Python tools
        env:
          MSYS2_PATH_TYPE: inherit
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          uv_sync_args=(
            --locked
            --no-python-downloads
            --no-install-project
          )
          uv sync "${uv_sync_args[@]}"

      - name: Build Windows
        env:
          BRANCH: ${{ github.ref_name }}
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          NODEJS_PATH=$(cygpath "$NODEJS_PATH")
          export PATH="$PATH:$NODEJS_PATH"

          mkdir -p build
          cmake \
            -B build \
            -G Ninja \
            -S . \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSUNSHINE_ASSETS_DIR=assets \
            -DSUNSHINE_PUBLISHER_NAME="NVStream" \
            -DSUNSHINE_PUBLISHER_WEBSITE="https://example.invalid" \
            -DSUNSHINE_PUBLISHER_ISSUE_URL="https://example.invalid"
          ninja -C build

      - name: Package Windows
        run: |
          mkdir -p artifacts
          cd build
          cpack -G WIX
          cpack -G ZIP
          mv ./cpack_artifacts/NVStream.msi ../artifacts/NVStream-installer.msi
          mv ./cpack_artifacts/NVStream.zip ../artifacts/NVStream-lite.zip

      - name: Debug wix
        if: always()
        run: cat ./build/cpack_artifacts/_CPack_Packages/win64/WIX/wix.log || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: build-Windows-AMD64
          path: artifacts/
          if-no-files-found: error
